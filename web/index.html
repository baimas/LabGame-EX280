<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminauta EX280</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <meta name="theme-color" content="#57449a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <img src="assets/logo.svg" alt="" width="36" height="36">
      <div>
        <strong id="marca-nome">Terminauta</strong>
        <small id="subtitulo"></small>
      </div>
    </div>
    <div class="nivel">
      <div class="nivel-texto"><span id="nivel-nome"></span><span id="nivel-xp"></span></div>
      <div class="barra"><div id="nivel-barra"></div></div>
    </div>
    <div class="acoes-topo">
      <div class="trilhas" id="trilhas" role="group" aria-label="Prova"></div>
      <button id="btn-idioma" class="fantasma" type="button"></button>
    </div>
  </header>

  <div class="palco">
    <nav id="lista" class="lateral" aria-label="Missões"></nav>

    <main class="centro">
      <section id="chamado" class="chamado"></section>
      <section class="console">
        <div class="console-barra">
          <span><span class="luzes" aria-hidden="true"><i></i><i></i><i></i></span><span id="console-titulo">workstation</span></span>
          <span id="relogio" class="relogio"></span>
        </div>
        <div id="terminal" class="terminal"></div>
      </section>
    </main>
  </div>

  <footer class="assinatura">
    <span>By: <strong>Vinicius Baimas</strong></span>
    <a href="https://www.linkedin.com/in/baimas/" target="_blank" rel="noopener" aria-label="LinkedIn de Vinicius Baimas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zM9.5 9.75h3.8v1.5h.06c.53-1 1.83-1.8 3.76-1.8 4.02 0 4.78 2.45 4.78 5.64v5.66h-4v-5.02c0-1.2-.02-2.74-1.73-2.74-1.73 0-2 1.3-2 2.65v5.11h-4z"/></svg>
      LinkedIn
    </a>
    <a href="https://github.com/baimas" target="_blank" rel="noopener" aria-label="GitHub de Vinicius Baimas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.47-1.1-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
      GitHub
    </a>
  </footer>

  <div id="editor" class="editor" hidden>
    <div class="editor-caixa">
      <div class="editor-barra">
        <span id="editor-arquivo"></span>
        <span class="editor-botoes">
          <button id="editor-cancelar" class="fantasma" type="button"></button>
          <button id="editor-salvar" class="primario" type="button"></button>
        </span>
      </div>
      <textarea id="editor-texto" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="editor-rodape" id="editor-dica"></div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
