<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terminauta">
  <title>Terminauta</title>
  <defs>
    <linearGradient id="tn-fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b57b8"/>
      <stop offset="1" stop-color="#3f3175"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tn-fundo)"/>
  <!-- estrelas -->
  <path d="M13 10.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#d9d7ef"/>
  <circle cx="52" cy="13" r="1.3" fill="#d9d7ef" opacity=".8"/>
  <circle cx="10.5" cy="48" r="1" fill="#d9d7ef" opacity=".6"/>
  <!-- antena -->
  <path d="M41 13.5l4-5" stroke="#e8f1f9" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="46" cy="7.5" r="2.4" fill="#d9d7ef"/>
  <!-- pescoço do traje -->
  <rect x="20" y="46" width="24" height="8.5" rx="4.25" fill="#d9d7ef"/>
  <!-- capacete -->
  <circle cx="32" cy="30" r="18" fill="#e8f1f9"/>
  <rect x="11" y="25" width="5" height="11" rx="2.5" fill="#d9d7ef"/>
  <rect x="48" y="25" width="5" height="11" rx="2.5" fill="#d9d7ef"/>
  <!-- viseira com o prompt do terminal -->
  <rect x="19" y="20" width="26" height="19" rx="9.5" fill="#1f252f"/>
  <path d="M38.5 23.2a7 7 0 0 1 3.4 3" fill="none" stroke="#e8f1f9" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M25 25.5l4.2 4-4.2 4" fill="none" stroke="#d9d7ef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31.5 33.5h7" stroke="#d9d7ef" stroke-width="2.4" stroke-linecap="round"/>
</svg>
